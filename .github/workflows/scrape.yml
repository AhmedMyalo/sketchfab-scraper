name: Sketchfab scrape

# Runs on GitHub's own runners -- never the user's machine, never the user's
# personal IP -- exactly the isolation the CGTrader sibling project used.
# No browser/WAF-solving step exists here at all (unlike CGTrader): Sketchfab's
# /v3 endpoints are a plain, unauthenticated JSON API with no challenge in
# front of it. There IS real rate limiting under sustained load, though: a
# 10-request burst test showed nothing, but the first live 18-way-parallel
# run hit HTTP 429 within minutes in every job that got far enough to notice.
# max-parallel and the per-request delay below are the response to that.
on:
  # Re-enabled 2026-09-24: runs #5-#7 each completed cleanly end to end after
  # the git-add fix (7357b2c) -- real listing data and real detail/comment
  # data confirmed landing on main, no repeats of the earlier 429-crash or
  # zero-commits failures. Each run only makes ~180min of progress before its
  # own budget runs out, and nothing else was re-triggering it, so 6h auto-
  # retry is what keeps this moving without needing a manual trigger every
  # time. Harmless once there's genuinely nothing left to do -- a run with no
  # new models to list or detail finishes in well under a minute.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  list:
    strategy:
      fail-fast: false
      # Was capped at 3, on the theory that aggregate load across parallel
      # jobs was what tripped the 429s. Real evidence from run #5 says
      # otherwise: 'architecture' and 'art-abstract' each independently hit
      # 429 at their OWN ~4,800-model mark while running side by side -- the
      # same threshold, same timing, no sign either one's block was affected
      # by the other. That's what a PER-JOB (likely per-runner-IP) quota
      # looks like, not a shared aggregate one. The actual reason zero data
      # ever landed for so long was the git-add bug (see commit 7357b2c), not
      # concurrency. Raised back toward the original 18 so more categories
      # can each independently make their own progress-then-wait cycle in
      # parallel, since one job's 429 doesn't cost its siblings anything.
      max-parallel: 9
      matrix:
        category:
          - animals-pets
          - architecture
          - art-abstract
          - cars-vehicles
          - characters-creatures
          - cultural-heritage-history
          - electronics-gadgets
          - fashion-style
          - food-drink
          - furniture-home
          - music
          - nature-plants
          - news-politics
          - people
          - places-travel
          - science-technology
          - sports-fitness
          - weapons-military

    runs-on: ubuntu-latest
    timeout-minutes: 350

    concurrency:
      group: sketchfab-list-${{ matrix.category }}
      cancel-in-progress: false

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List ${{ matrix.category }} in chunks, committing after each
        run: |
          set -u
          CHUNK_MIN=20
          # Cut from 180: the user's priority is comments/detail, not
          # finishing the listing phase fast. Listing is resumable (cursor
          # persisted) and re-invoked every 6h by cron regardless, so a
          # smaller budget here just means smaller bites per cycle, not
          # lost progress -- it hands off to detail sooner within THIS run.
          TOTAL_MIN=60
          deadline=$(( $(date +%s) + TOTAL_MIN * 60 ))

          chunk_no=0
          while :; do
            if [ -f "sketchfab_raw/${{ matrix.category }}.complete" ]; then
              echo "[chunk] ${{ matrix.category }} listing already complete"
              break
            fi
            now=$(date +%s)
            left_min=$(( (deadline - now) / 60 ))
            if [ "$left_min" -lt 3 ]; then
              echo "[chunk] listing budget exhausted for this run"
              break
            fi
            this_chunk=$CHUNK_MIN
            [ "$left_min" -lt "$CHUNK_MIN" ] && this_chunk=$left_min

            chunk_no=$(( chunk_no + 1 ))
            echo "::group::chunk $chunk_no (${this_chunk}min, ${left_min}min left)"
            python sketchfab_scraper.py --list-category "${{ matrix.category }}" \
              --delay 1.2 --max-minutes "$this_chunk"
            rc=$?
            echo "::endgroup::"

            bash commit_progress.sh "list-${{ matrix.category }}"
            commit_rc=$?

            if [ "$rc" -ne 0 ]; then
              echo "::warning::listing exited $rc on chunk $chunk_no"
              exit "$rc"
            fi
            if [ "$commit_rc" -ne 0 ]; then
              # This was the real bug behind the first live run: 17/18 jobs
              # showed green while pushing nothing, because this exit code
              # was never checked. A push failure after 8 retries means this
              # chunk's progress is sitting on the runner's disk only and is
              # about to be thrown away when the job ends -- that MUST fail
              # the job loudly, not report success.
              echo "::error::push failed after retries on chunk $chunk_no -- this chunk's progress could not reach origin/main"
              exit 1
            fi
          done

  detail:
    # Deliberately NOT `needs: list`. That dependency meant detail waited for
    # the ENTIRE 18-job listing matrix to reach a terminal state before doing
    # a single model -- watched this cost over an hour of a run with the
    # user's stated top priority (comments/detail) sitting completely idle
    # while listing's first 9-wide batch was still stuck on its own 429
    # waits. detail already reads whatever's on sketchfab_raw/*.jsonl at
    # checkout time regardless of which run wrote it, so there's no reason
    # for it to wait on THIS run's listing to finish -- it can start
    # immediately on the 630k+ models already known from earlier cycles,
    # and listing keeps discovering more in parallel for future cycles.
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        # detail was a SINGLE job with one shared concurrency group, meaning
        # only one detail worker ever ran at a time no matter how many
        # workflow runs were queued -- the actual bottleneck once the 429
        # waits and the time-budget rebalance were both fixed. Sharded the
        # same way the CGTrader sibling project split its last category:
        # partition by uid (see _shard_key), each shard gets its own
        # concurrency group so they run genuinely in parallel. Evidence
        # from the listing phase (architecture and art-abstract independently
        # hitting 429 at the same ~4,800-model mark with no sign of shared
        # contention) suggests the quota is per-job, so this should multiply
        # throughput rather than just divide the same quota N ways. Raised
        # 8 -> 16 chasing a 2-day deadline: measured sharded rate was
        # ~1,586 models/h at 8-wide; the reduced (--require-comments --since)
        # backlog of ~110k needs roughly double that to fit in 48h.
        shard: ["0/16", "1/16", "2/16", "3/16", "4/16", "5/16", "6/16", "7/16",
                "8/16", "9/16", "10/16", "11/16", "12/16", "13/16", "14/16", "15/16"]

    concurrency:
      group: sketchfab-detail-${{ matrix.shard }}
      cancel-in-progress: false

    steps:
      - name: Check out the repo (latest, after all listing pushes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch model detail + comments in chunks, committing after each
        run: |
          set -u
          CHUNK_MIN=20
          # Raised from 180 toward the job's own 350min ceiling (timeout-
          # minutes above), leaving ~30min headroom for checkout/export/
          # upload. This is the priority now over how fast listing finishes.
          TOTAL_MIN=320
          deadline=$(( $(date +%s) + TOTAL_MIN * 60 ))

          chunk_no=0
          while :; do
            now=$(date +%s)
            left_min=$(( (deadline - now) / 60 ))
            if [ "$left_min" -lt 3 ]; then
              echo "[chunk] detail budget exhausted for this run"
              break
            fi
            this_chunk=$CHUNK_MIN
            [ "$left_min" -lt "$CHUNK_MIN" ] && this_chunk=$left_min

            chunk_no=$(( chunk_no + 1 ))
            echo "::group::chunk $chunk_no (${this_chunk}min, ${left_min}min left)"
            # comments/since read fields the LISTING response already has for
            # free (commentCount, publishedAt) -- see load_targets() in
            # sketchfab_scraper.py: comments are the actual priority, not an
            # exhaustive per-model catalog, and "last 3 years" is the recency
            # window. That alone cuts 876k+ down to ~110k (measured).
            #
            # --sample-pct added after the deadline stayed fixed but the
            # SUSTAINED rate (measured over a real 21h window: 779 models/h,
            # not the ~5,700/h an early short burst suggested) turned out far
            # too slow to finish ~106k remaining in time. Draws a clean random
            # 18% of whatever passes the other two filters -- same hash-based
            # approach as sharding, every worker agrees with no coordination,
            # sized so the final dataset is an honest random sample of the
            # qualifying population rather than "whatever order happened to
            # get processed before the deadline hit" (which would have been
            # biased toward newer-published models, since that's listing's
            # own order).
            python sketchfab_scraper.py --detail --shard "${{ matrix.shard }}" \
              --require-comments --since 2023-09-26 --sample-pct 18 \
              --delay 1.2 --max-minutes "$this_chunk" \
              | tee /tmp/detail_chunk.log
            rc=$?
            echo "::endgroup::"

            bash commit_progress.sh "detail-${{ matrix.shard }}"
            commit_rc=$?

            if [ "$rc" -ne 0 ]; then
              echo "::warning::detail pass exited $rc on chunk $chunk_no"
              exit "$rc"
            fi
            if [ "$commit_rc" -ne 0 ]; then
              echo "::error::push failed after retries on chunk $chunk_no -- this chunk's progress could not reach origin/main"
              exit 1
            fi
            # The script prints this and exits 0 with nothing left to do when
            # every currently-known model in THIS shard has already been
            # detailed. That's this run's real "done" signal, not a fixed
            # chunk count.
            if grep -q "0 unique models discovered\|0 to fetch\|0 of 0 outstanding" /tmp/detail_chunk.log; then
              echo "[chunk] no models left to detail in this shard"
              break
            fi
          done

      # Only one shard exports: it rebuilds the CSVs from every shard file
      # on disk (all 8 workers' output), so running this in all 8 jobs would
      # do the same expensive work 8 times and upload 8 artifacts under one
      # name, which is an error, not a merge.
      - name: Export CSVs
        if: always() && startsWith(matrix.shard, '0/')
        run: python sketchfab_scraper.py --export

      - name: Upload CSV export
        if: always() && startsWith(matrix.shard, '0/')
        uses: actions/upload-artifact@v4
        with:
          # run_attempt included: a re-run of just this job would otherwise
          # try to create an artifact with the same name the first attempt
          # already created in this same run, which is exactly what caused
          # detail (0/16)'s failure -- "(409) Conflict: an artifact with
          # this name already exists on the workflow run" AFTER the real
          # scraping work (fetch + commit) had already succeeded cleanly.
          # Purely a reporting/upload-naming bug, not data loss: every
          # commit in that job's log landed on main before this ran.
          name: sketchfab-csv-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            sketchfab_models.csv
            sketchfab_comments.csv
          if-no-files-found: warn
          retention-days: 90

  check-completion:
    needs: detail
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repo (latest)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute overall progress
        id: progress
        run: python check_completion.py

      - name: Open the "all done" issue, once
        if: steps.progress.outputs.complete == 'true'
        env:
          # Values reach the script through env, never through raw ${{ }}
          # interpolation -- the CGTrader project's completion step was
          # broken exactly this way (a multi-line value pasted into a JS
          # string literal is a guaranteed syntax error) until it was fixed.
          PROGRESS_TABLE: ${{ steps.progress.outputs.table }}
          TOTAL_DONE: ${{ steps.progress.outputs.total_done }}
          TOTAL_TARGET: ${{ steps.progress.outputs.total_target }}
          MISSING: ${{ steps.progress.outputs.missing }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Sketchfab scrape complete (18/18 categories)";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "all", labels: "scrape-complete",
            });
            if (existing.length > 0) {
              console.log("Completion issue already exists, not opening another.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["scrape-complete"],
              body: [
                "Every category has been fully listed and every discovered",
                "model has full detail + comments (or is confirmed gone).",
                "",
                `**${process.env.TOTAL_DONE} / ${process.env.TOTAL_TARGET}** models (${process.env.MISSING} unaccounted for)`,
                "",
                process.env.PROGRESS_TABLE,
                "",
                "The scheduled workflow will keep running every 6h (harmless,",
                "finishes in well under a minute once nothing is left to do)",
                "unless disabled from the Actions tab.",
              ].join("\n"),
            });
